name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/harmonic-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/harmonic-core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo check --all-targets --all-features --locked
      - run: cargo build --all-targets --all-features --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Start preview server for k6
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/logiscore-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/logiscore-preview.log
          exit 1
      - name: Run k6 static delivery scenario
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/apps/web/tests/load:/scripts:ro"
          grafana/k6:2.2.0 run
          -e BASE_URL=http://127.0.0.1:4173
          /scripts/static-assets.js
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
