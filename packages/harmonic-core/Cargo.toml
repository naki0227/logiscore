[package]
name = "harmonic-core"
version = "0.1.0"
edition = "2021"
description = "Logiscore: Reversible source code to MIDI encoder/decoder"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "logiscore"
path = "src/main.rs"


[dependencies]
flate2 = "1"
midly = { version = "0.5", features = ["alloc"] }
thiserror = "2"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
